name: Build macOS desktop
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache: false
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - name: Install tunnel helper
        run: brew install cloudflared
      - name: Verify Go and Rust
        run: |
          go test ./...
          go vet ./...
          cargo test --locked --manifest-path gui/Cargo.toml
          cargo clippy --locked --manifest-path gui/Cargo.toml --all-targets -- -D warnings
          mkdir -p bin
          go build -o bin/mcp-shell ./cmd/mcp-shell
          MCP_SHELL_TEST_BINARY="$PWD/bin/mcp-shell" cargo test --locked --manifest-path gui/Cargo.toml real_server_auth_files_commands_cancellation_and_shutdown -- --ignored --nocapture
      - name: Package native app
        run: bash build-gui-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-shell-desktop-macos-${{ matrix.arch }}
          path: dist/mcp-shell-desktop-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
